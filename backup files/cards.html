<!-- Cards -->
<div class="space-y-6">
    <!-- Waitlist Card -->
    <div class="card">
        <p class="text-gray-600 mb-6">
          Join the waitlist to get early access to a worker-owned alternative to corporate VPNs.
        </p>
        <form class="flex gap-3">
          <button type="submit" class="btn btn-primary">
              Join
          </button>

            <input
                type="email"
                placeholder="Type your email..."
                class="flex-1 px-4 py-3 border-2 bg-cream border-gray-200 rounded-lg focus:outline-none focus:border-accent"
            >

        </form>
    </div>

    <!-- Download Card -->
    <div class="card">
        <p class="text-gray-600 mb-6">
            Download CoopVPN from the Google Play Beta channel and share your feedback. As a beta tester, you'll get one year of free access to our paid plan.
        </p>
        <button type="submit" class="btn btn-primary">
            Try it!
        </button>
    </div>
